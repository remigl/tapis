name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege by default; jobs ask for more only when they need it.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (supply-chain safety).
# Dependabot keeps them up to date (.github/dependabot.yml).

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest stable Go: releases always get the newest standard-library security fixes.
          go-version: stable
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet (Linux and Windows)
        run: go vet ./... && GOOS=windows go vet ./...
      - name: Tests (with race detector)
        run: go test -race ./...
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Fuzzing (short run of every fuzz target)
        run: |
          go test ./internal/ws/     -run '^$' -fuzz '^FuzzReadMessage$' -fuzztime 15s
          go test ./internal/server/ -run '^$' -fuzz '^FuzzDispatch$'    -fuzztime 15s
          go test ./internal/qr/     -run '^$' -fuzz '^FuzzEncode$'      -fuzztime 10s
          go test ./internal/media/  -run '^$' -fuzz '^FuzzNormalize$'   -fuzztime 10s
          go test ./internal/input/  -run '^$' -fuzz '^FuzzLayouts$'     -fuzztime 10s
      - name: Windows build with resources (as released)
        run: |
          cd cmd/tapis
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --icon ../../assets/tapis.ico --manifest gui \
            --product-name Tapis --product-version 0.0.0.0 --file-version 0.0.0.0
          GOOS=windows GOARCH=amd64 go build -ldflags "-H windowsgui" -o /tmp/tapis.exe .
          rm -f *.syso

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write     # publish the release
      id-token: write     # Sigstore keyless signing of the build provenance
      attestations: write # store the signed attestations on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest stable Go: releases always get the newest standard-library security fixes.
          go-version: stable

      - name: Windows resources (icon, version information, manifest)
        continue-on-error: true # never block a release for the icon
        run: |
          v="${GITHUB_REF_NAME#v}"; v="${v%%-*}.0"
          cd cmd/tapis
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64,arm64 \
            --icon ../../assets/tapis.ico --manifest gui \
            --product-name Tapis --file-description "Tapis - phone trackpad and keyboard" \
            --product-version "$v" --file-version "$v" --original-filename tapis.exe \
            --copyright "Remi Gladieu - GPL-3.0"

      - name: Build
        run: |
          mkdir dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""; gui=""
            # Windows: no console window, Tapis lives in the notification area.
            [ "$os" = windows ] && ext=".exe" && gui="-H windowsgui"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=true \
              -ldflags "-s -w $gui -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/tapis-${GITHUB_REF_NAME}-${os}-${arch}${ext}" ./cmd/tapis
          done

      # ---- Windows Authenticode signing (SignPath Foundation, free for OSS) ----
      # Enabled once the project is accepted: set the repository variables
      # SIGNPATH_ORGANIZATION_ID and SIGNPATH_PROJECT_SLUG and the secret
      # SIGNPATH_API_TOKEN. See CODE_SIGNING.md.
      - name: Upload Windows binaries for signing
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned
          path: dist/*.exe
      - name: Sign Windows binaries (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Use signed Windows binaries
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: cp signed/*.exe dist/

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      # Signed, publicly verifiable proof that each file was built by this
      # workflow from this exact commit (Sigstore, SLSA build provenance):
      #   gh attestation verify <file> --repo remigl/tapis
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # Works both for a tag pushed with git and for a release drafted on github.com.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
          fi
